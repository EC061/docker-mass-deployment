name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:

jobs:
  agent:
    name: Agent (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Install
        run: uv venv && uv pip install -e ".[dev]"
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest -q

  controller:
    name: Controller (eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controller/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  lab-image:
    name: Lab image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build pinned lab image
        run: docker build --tag custom-ssh:ci image
      - name: Verify CUDA toolkit and image contract
        run: |
          image_size=$(docker image inspect custom-ssh:ci --format '{{.Size}}')
          echo "Lab image size: $image_size bytes"
          test "$image_size" -lt $((4 * 1024 * 1024 * 1024))
          docker run --rm --entrypoint sh custom-ssh:ci -c '
            nvcc --version
            python --version
            test "$(command -v python)" = /usr/bin/python
            ! command -v node
            ! command -v npm
            ! command -v codex
            useradd -m -s /bin/bash student
            su - student -c "nvcc --version"
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              nvcc --version
          '
